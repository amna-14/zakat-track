<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZakatTrack | Donor Login</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="index.html"><img class="logo" src="logo.png" alt="" onerror="this.style.display='none'"><span>ZakatTrack</span></a><nav><a href="index.html">Home</a><a href="login.html">Login</a><a href="donate.html">Donate</a></nav></header>
<main><div class="card box"><h2>Donor Login</h2>
<form id="loginForm" novalidate>
<label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com">
<label for="password">Password</label>
<div class="row"><input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters"><button type="button" id="toggle" class="btn alt">Show</button></div>
<p class="msg" id="loginMsg" role="alert"></p>
<button class="btn" type="submit">Login</button>
</form>
<p class="note">New donor? Registration will be added in the next version. This demo does not check real accounts.</p></div></main>
<footer>ZakatTrack | Secure Software Development semester project | Prototype only, no real payments</footer><script src="script.js"></script></body></html>
